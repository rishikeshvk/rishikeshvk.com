name: Test build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  # Keep in sync with ZOLA_VERSION in Cloudflare Pages settings.
  ZOLA_VERSION: 0.23.6

jobs:
  test:
    name: Test Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin zola
          zola --version

      - name: Zola Build
        run: zola build
